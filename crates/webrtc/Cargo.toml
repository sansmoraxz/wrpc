[package]
name = "wrpc-webrtc"
version = "0.1.0"
description = "wRPC WebRTC data channel transport"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["webrtc"]
webrtc = ["dep:webrtc"]

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync"] }
tracing = { workspace = true }
webrtc = { workspace = true, features = ["runtime-tokio", "crypto-ring"], optional = true }
wrpc-transport = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
futures = { workspace = true }
test-log = { workspace = true, features = ["color", "log", "trace"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wrpc-test = { workspace = true }
